
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dein Wochenreview · Personal Growth</title>
<style>
:root{--bg:#f4f0e9;--paper:#fffdf9;--ink:#282923;--muted:#77766e;--line:#e6e0d6;--accent:#657765}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:24px 18px 50px;min-height:100vh;display:flex;flex-direction:column}
header{padding:20px 2px 18px}
.eyebrow{letter-spacing:.15em;font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{font:500 clamp(34px,7vw,46px)/1.12 Georgia,serif;margin:9px 0}
header p,.hint{color:var(--muted)}
.progress{margin:12px 0 20px}
.progressline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}
.track{height:5px;background:#e2ddd3;border-radius:9px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,36px);box-shadow:0 7px 24px #38301a08;flex:1;display:flex;flex-direction:column;min-height:390px}
.kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h2{font:500 clamp(25px,5vw,32px)/1.2 Georgia,serif;margin:12px 0 8px}
.hint{font-size:14px;margin:0 0 24px}
textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fffefa;color:var(--ink);font:inherit}
textarea{min-height:180px;resize:vertical;flex:1}
input:focus,textarea:focus{outline:2px solid #aab9a5;outline-offset:1px}
.rating{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.rating label{margin:0;cursor:pointer}
.rating input{position:absolute;opacity:0;width:1px}
.rating span{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:white;font-size:14px;padding:0}
.rating input:checked+span{background:var(--accent);color:white;border-color:var(--accent)}
.rating-caption{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
button{border:0;border-radius:999px;padding:13px 20px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
.primary{background:var(--accent);color:white;margin-left:auto}
.secondary{background:#e9e4da;color:var(--ink)}
button:disabled{opacity:.35;cursor:default}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.output{white-space:pre-wrap;min-height:220px;background:#f8f6f1;border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.55 monospace}
.note,.done{font-size:12px;color:var(--muted)}
@media(max-width:500px){main{padding:16px 12px 30px}.panel{min-height:420px}.rating span{width:35px;height:35px}}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">Personal Growth · Reflexion</div>
<h1>Dein Wochenreview</h1>
<p>Eine Frage nach der anderen. Nimm dir den Raum, den du brauchst – du musst nicht alles beantworten.</p>
</header>
<div class="progress">
<div class="progressline"><span id="stepLabel">Schritt 1</span><span id="percent">0 %</span></div>
<div class="track"><span id="bar"></span></div>
</div>
<section class="panel" id="panel" aria-live="polite"></section>
<div class="nav">
<button class="secondary" id="back" type="button">Zurück</button>
<button class="primary" id="next" type="button">Weiter</button>
</div>
</main>
<script>
const steps=[
{id:"week",kind:"meta",category:"Ankommen",title:"Für welche Woche blickst du zurück?",prompt:"Trage den Zeitraum ein, den du reflektieren möchtest.",label:"Woche / Zeitraum",placeholder:"z. B. 19.–25. Oktober 2026"},
{id:"headline",kind:"meta",category:"Ankommen",title:"Welche Überschrift gibst du dieser Woche?",prompt:"Wenn diese Woche ein Kapitel wäre – wie würde es heißen?",label:"Deine Überschrift",placeholder:"Ein paar Worte reichen."},
{id:"domain0",category:"Deine Woche · Lebensbereiche",title:"Arbeit & Selbstständigkeit",prompt:"Wie hast du diesen Bereich erlebt? Aufgaben, Fortschritte, Motivation, Belastung und Selbstbestimmung.",rating:true},
{id:"domain1",category:"Deine Woche · Lebensbereiche",title:"Finanzen",prompt:"Wie hast du diesen Bereich erlebt? Einnahmen, Ausgaben, Sicherheit und dein Umgang mit Geld.",rating:true},
{id:"domain2",category:"Deine Woche · Lebensbereiche",title:"Beziehung",prompt:"Wie hast du diesen Bereich erlebt? Nähe, Kommunikation, gemeinsame Zeit und Bedürfnisse.",rating:true},
{id:"domain3",category:"Deine Woche · Lebensbereiche",title:"Freunde, Familie & soziale Kontakte",prompt:"Wie hast du diesen Bereich erlebt? Verbundenheit, Austausch, Unterstützung und Grenzen.",rating:true},
{id:"domain4",category:"Deine Woche · Lebensbereiche",title:"Freizeit & Lebensqualität",prompt:"Wie hast du diesen Bereich erlebt? Freude, Erholung, Interessen und Abwechslung.",rating:true},
{id:"domain5",category:"Deine Woche · Lebensbereiche",title:"Gesundheit & Energie",prompt:"Wie hast du diesen Bereich erlebt? Körpergefühl, Schlaf, Bewegung, Stimmung und Energie.",rating:true},
{id:"domain6",category:"Deine Woche · Lebensbereiche",title:"Persönliche Entwicklung",prompt:"Wie hast du diesen Bereich erlebt? Selbstwahrnehmung, Lernen, Mut und neue Erkenntnisse.",rating:true},
{id:"wins",category:"Dein Wochenrückblick",title:"Was ist dir gelungen?",prompt:"Worauf bist du stolz – auch wenn es nur eine Kleinigkeit war?"},
{id:"good",category:"Dein Wochenrückblick",title:"Was hat dir gutgetan?",prompt:"Welche Momente haben dir Freude, Ruhe oder Energie gegeben?"},
{id:"hard",category:"Dein Wochenrückblick",title:"Was war schwierig?",prompt:"Was hat dich belastet oder besonders viel Energie gekostet?"},
{id:"pattern",category:"Dein Wochenrückblick",title:"Was ist dir an dir aufgefallen?",prompt:"Gab es wiederkehrende Gedanken, Gefühle oder Verhaltensweisen?"},
{id:"unfinished",category:"Dein Wochenrückblick",title:"Was ist noch offen?",prompt:"Was möchtest du bewusst mitnehmen, klären oder loslassen?"},
{id:"learned",category:"Dein Wochenrückblick",title:"Was hast du gelernt?",prompt:"Welche Erkenntnis nimmst du aus dieser Woche mit?"},
{id:"change",category:"Blick nach vorn",title:"Was möchtest du nächste Woche anders machen?",prompt:"Wähle eine kleine, realistische Veränderung."},
{id:"focus",category:"Blick nach vorn",title:"Was ist deine wichtigste Priorität?",prompt:"Was verdient nächste Woche deine Aufmerksamkeit?"},
{id:"support",category:"Blick nach vorn",title:"Was brauchst du dafür?",prompt:"Welche Unterstützung, Grenze oder Rahmenbedingung würde helfen?"},
{id:"question",category:"Blick nach vorn",title:"Was möchtest du vertiefen?",prompt:"Welche Frage soll in der gemeinsamen Reflexion genauer betrachtet werden?"}
];
const answers={};
let current=0;
const panel=document.getElementById("panel");
const back=document.getElementById("back");
const next=document.getElementById("next");

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
const final=current===steps.length;
document.getElementById("stepLabel").textContent=final?"Abschluss":`Schritt ${current+1} von ${steps.length}`;
const pct=Math.round(current/steps.length*100);
document.getElementById("percent").textContent=pct+" %";
document.getElementById("bar").style.width=pct+"%";
back.disabled=current===0;
next.textContent=final?"Review erstellen":"Weiter";

if(final){
panel.innerHTML=`
<div class="kicker">Fast geschafft</div>
<h2>Dein Rückblick ist bereit.</h2>
<p class="hint">Erstelle einen strukturierten Text für dein ChatGPT-Projekt „Personal Growth – Entwicklung & Reflexion“.</p>
<p class="done">Du kannst jederzeit mit „Zurück“ zu deinen Antworten gehen.</p>
<div class="actions">
<button class="primary" id="make">Reflexionstext erstellen</button>
<button class="secondary" id="copy">Text kopieren</button>
<button class="secondary" id="save">Als TXT speichern</button>
</div>
<div id="output" class="output">Dein fertiger Text erscheint hier.</div>
<p class="note">Deine Eingaben bleiben lokal in dieser Browserseite. Es wird nichts automatisch übertragen.</p>`;
document.getElementById("make").onclick=generate;
document.getElementById("copy").onclick=copyText;
document.getElementById("save").onclick=downloadText;
return;
}
const s=steps[current],v=answers[s.id]||{};
let field="";
if(s.kind==="meta"){
field=`<label for="answer">${esc(s.label)}</label><input id="answer" type="text" value="${esc(v.text||"")}" placeholder="${esc(s.placeholder)}">`;
}else if(s.rating){
let radios="";
for(let n=1;n<=10;n++)radios+=`<label><input type="radio" name="score" value="${n}" ${String(v.score||"")===String(n)?"checked":""}><span>${n}</span></label>`;
field=`<p class="rating-caption">1 = sehr schwierig / wenig stimmig · 10 = sehr gut / sehr stimmig</p><div class="rating">${radios}</div><label for="answer">Was steckt hinter deiner Einschätzung?</label><textarea id="answer" placeholder="Beschreibe kurz, was in diesem Bereich los war …">${esc(v.text||"")}</textarea>`;
}else{
field=`<textarea id="answer" placeholder="Schreibe auf, was dir dazu einfällt …">${esc(v.text||"")}</textarea>`;
}
panel.innerHTML=`<div class="kicker">${esc(s.category)}</div><h2>${esc(s.title)}</h2><p class="hint">${esc(s.prompt)}</p>${field}`;
const answer=document.getElementById("answer");
answer.addEventListener("input",()=>{
answers[s.id]=answers[s.id]||{};
answers[s.id].text=answer.value;
});
if(s.rating){
document.querySelectorAll('input[name="score"]').forEach(x=>x.addEventListener("change",()=>{
answers[s.id]=answers[s.id]||{};
answers[s.id].score=x.value;
}));
}
}
function generate(){
let out="DEIN WOCHENREVIEW – PERSONAL GROWTH\n";
steps.forEach(s=>{
const a=answers[s.id]||{};
out+=`\n${s.title}\n`;
if(s.rating)out+=`Einschätzung: ${a.score?a.score+"/10":"nicht bewertet"}\n`;
out+=(a.text||"—")+"\n";
});
out+="\nBitte analysiere diesen Rückblick im Rahmen meines Personal-Growth-Projekts. Unterscheide Fakten, Gefühle und Interpretationen. Vergleiche mit früheren Reviews, sofern sie im Projekt verfügbar sind. Benenne Ressourcen, Entwicklungen, Spannungen und mögliche Muster als Hypothesen. Fordere mich respektvoll heraus und leite wenige realistische nächste Schritte ab.";
document.getElementById("output").textContent=out;
}
async function copyText(){
const el=document.getElementById("output");
if(el.textContent==="Dein fertiger Text erscheint hier.")generate();
try{
await navigator.clipboard.writeText(document.getElementById("output").textContent);
alert("Der Text wurde kopiert.");
}catch(e){alert("Bitte markiere den Text und kopiere ihn manuell.");}
}
function downloadText(){
if(document.getElementById("output").textContent==="Dein fertiger Text erscheint hier.")generate();
const blob=new Blob([document.getElementById("output").textContent],{type:"text/plain;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="Wochenreview.txt";
a.click();
URL.revokeObjectURL(a.href);
}
back.onclick=()=>{if(current>0){current--;render();}};
next.onclick=()=>{if(current<steps.length){current++;render();}else generate();};
render();
</script>
</body>
</html>
